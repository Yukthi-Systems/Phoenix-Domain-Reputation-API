name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below —
        for security vulnerabilities, use our [Security Policy](https://github.com/Yukthi-Systems/Phoenix-Domain-Reputation/security/policy)
        instead of a public issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include request/response examples where relevant (curl, .http, or Postman).
      placeholder: |
        1. Run `go run ./cmd/server` with '...'
        2. Send `GET /v1/reputation/domain/...`
        3. Observe '...'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant server logs. This will be rendered as a code block automatically.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD`, a release tag, or the Docker image tag you're running.
    validations:
      required: true

  - type: dropdown
    id: run-method
    attributes:
      label: How are you running the service?
      options:
        - go run / go build (local)
        - Docker (docker run)
        - Docker Compose
        - Other (please describe below)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version (`go version`), and any non-default environment variables (redact anything sensitive).
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help us understand the issue.
    validations:
      required: false
